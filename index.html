<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<meta name="robots" content="noindex, nofollow">
<title>NetQuest — Private Access</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0F1E'/%3E%3Ccircle cx='20' cy='40' r='7' fill='%2338BDF8'/%3E%3Ccircle cx='44' cy='22' r='7' fill='%23C084FC'/%3E%3Cpath d='M25 35 L39 27' stroke='%23E7ECF5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--bg2:#0D1428;--panel:rgba(148,170,220,.06);--line:rgba(148,170,220,.18);--line2:rgba(148,170,220,.30);
--tx:#E7ECF5;--tx2:#93A0BC;--tx3:#5D6B8C;--ccna:#38BDF8;--sec:#C084FC;--ok:#4ADE80;--bad:#F87171;
--gc:linear-gradient(135deg,#38BDF8,#22D3EE);--gcs:linear-gradient(135deg,#38BDF8,#C084FC);
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
background-image:radial-gradient(rgba(148,170,220,.10) 1px,transparent 1px);background-size:26px 26px;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
background:radial-gradient(620px 440px at 15% -10%,rgba(56,189,248,.14),transparent 60%),radial-gradient(620px 460px at 90% 110%,rgba(192,132,252,.13),transparent 60%)}
.wrap{position:relative;width:100%;max-width:410px;z-index:1}
.card{background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px;box-shadow:0 24px 60px rgba(2,6,18,.6)}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--fd);font-weight:700;font-size:23px;margin-bottom:4px}
.brand svg{width:30px;height:30px}
.brand em{font-style:normal;background:var(--gc);-webkit-background-clip:text;background-clip:text;color:transparent}
.lockring{width:60px;height:60px;margin:14px auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 35%,rgba(56,189,248,.22),rgba(192,132,252,.12));border:1px solid var(--line2)}
.lockring svg{width:26px;height:26px;stroke:var(--tx);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:var(--fd);font-size:20px;text-align:center;margin-top:8px}
.sub{text-align:center;color:var(--tx2);font-size:13.5px;margin:6px 0 22px}
label{display:block;font-size:12.5px;color:var(--tx2);margin:0 0 6px 2px;font-family:var(--fm);letter-spacing:.03em}
.fld{position:relative;margin-bottom:15px}
input[type=text],input[type=password]{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line2);
background:rgba(10,15,30,.6);color:var(--tx);font-size:15.5px;font-family:var(--fb);transition:.15s}
input:focus{outline:none;border-color:var(--ccna);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;cursor:pointer;
display:flex;align-items:center;justify-content:center;color:var(--tx3);border-radius:8px}
.eye:hover{color:var(--tx)}.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.row{display:flex;align-items:center;gap:9px;margin:4px 2px 20px;font-size:13.5px;color:var(--tx2);cursor:pointer;user-select:none}
.row input{width:17px;height:17px;accent-color:var(--ccna);cursor:pointer}
button.go{width:100%;padding:13px;border:none;border-radius:12px;background:var(--gcs);color:#04121F;font-family:var(--fd);font-weight:700;
font-size:15.5px;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;gap:9px}
button.go:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(56,189,248,.32)}
button.go:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.err{color:var(--bad);font-size:13.5px;text-align:center;min-height:20px;margin-top:14px;font-family:var(--fm);opacity:0;transition:.2s}
.err.show{opacity:1}
.foot{text-align:center;color:var(--tx3);font-size:11.5px;font-family:var(--fm);margin-top:20px;display:flex;align-items:center;justify-content:center;gap:6px}
.foot svg{width:13px;height:13px;stroke:var(--ok);fill:none;stroke-width:2}
.spin{width:17px;height:17px;border:2.5px solid rgba(4,18,31,.35);border-top-color:#04121F;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:440px){.card{padding:28px 22px 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="18" cy="44" r="8" fill="#38BDF8"/><circle cx="46" cy="20" r="8" fill="#C084FC"/><path d="M24 38 L40 26" stroke="#E7ECF5" stroke-width="4" stroke-linecap="round"/></svg>Net<em>Quest</em></div>
    <div class="lockring"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Private academy</h1>
    <p class="sub">This copy is for Jayachandra only. Enter your credentials to unlock.</p>
    <form id="f" autocomplete="off">
      <div class="fld"><label for="u">Username</label><input id="u" type="text" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="username"></div>
      <div class="fld"><label for="p">Password</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="password">
        <button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <label class="row"><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
      <button class="go" id="go" type="submit"><span id="golabel">Unlock NetQuest</span></button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot"><svg viewBox="0 0 24 24"><path d="M5 11h14v9H5z"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>AES-256 encrypted · only your credentials can open it</div>
  </div>
</div>

var enc=new TextEncoder();
function b64d(s){var bin=atob(s),len=bin.length,arr=new Uint8Array(len);for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);return arr;}
function rawB64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
async function keyFromCreds(creds){
  var base=await crypto.subtle.importKey("raw",enc.encode(creds),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(PL.s),iterations:PL.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function decryptWith(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(PL.i)},key,b64d(PL.c));
  return new TextDecoder().decode(pt);
}
function launch(html){
  try{sessionStorage.setItem("nq_locked","1");}catch(e){}
  document.open();document.write(html);document.close();
}
function showErr(msg){var e=document.getElementById("err");e.textContent=msg;e.classList.add("show");}
function busy(on){
  var b=document.getElementById("go"),l=document.getElementById("golabel");
  b.disabled=on;l.innerHTML=on?'<span class="spin"></span>':"Unlock NetQuest";
}
async function submit(ev){
  if(ev)ev.preventDefault();
  document.getElementById("err").classList.remove("show");
  var u=document.getElementById("u").value.trim();
  var p=document.getElementById("p").value;
  var rem=document.getElementById("rem").checked;
  if(!u||!p){showErr("Enter your username and password.");return;}
  busy(true);
  try{
    var key=await keyFromCreds(u+":"+p);
    var html=await decryptWith(key); /* throws if credentials are wrong */
    if(rem){try{var raw=await crypto.subtle.exportKey("raw",key);localStorage.setItem("nq_k",rawB64(raw));}catch(e){}}
    launch(html);
  }catch(e){
    busy(false);
    showErr("Wrong username or password.");
    var pw=document.getElementById("p");pw.value="";pw.focus();
  }
}
async function autoUnlock(){
  var kb=null;try{kb=localStorage.getItem("nq_k");}catch(e){}
  if(!kb)return false;
  try{
    var key=await crypto.subtle.importKey("raw",b64d(kb),{name:"AES-GCM"},true,["decrypt"]);
    var html=await decryptWith(key);
    launch(html);return true;
  }catch(e){try{localStorage.removeItem("nq_k");}catch(_){}return false;}
}
document.getElementById("eye").addEventListener("click",function(){
  var p=document.getElementById("p");p.type=p.type==="password"?"text":"password";
});
document.getElementById("f").addEventListener("submit",submit);
(async function(){ if(!(await autoUnlock())){ document.getElementById("u").focus(); } })();
</script>
